<div class="dialog">
  <div class="icon">
    <mat-icon>delete</mat-icon>
  </div>

  <h2 class="title">Excluir curso</h2>

  <mat-dialog-content>
    <p class="message">
      Tem certeza que deseja excluir
      <strong>{{ course.name }}</strong
      >?
    </p>
    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions>
    <button type="button" class="cancelButton" (click)="cancel()" [disabled]="deleting()">
      Cancelar
    </button>
    <button type="button" class="deleteButton" (click)="confirm()" [disabled]="deleting()">
      {{ deleting() ? 'Excluindo...' : 'Excluir' }}
    </button>
  </mat-dialog-actions>
</div>
