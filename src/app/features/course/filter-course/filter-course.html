<div class="flex flex-col md:flex-row gap-3 w-full md:w-auto">

    class="searchInputContainer flex items-center bg-[#202024] rounded-lg px-4 py-3 w-full md:w-72 focus-within:ring-2 focus-within:ring-purple-600 transition group"
